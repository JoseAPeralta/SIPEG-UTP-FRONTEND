services:
  frontend:
    image: sipeg-utp-frontend:dev
    build:
      context: .
      target: development
    init: true
    command: ["pnpm", "run", "dev", "--host", "0.0.0.0", "--strictPort"]
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:3000/api}"
    ports:
      - "127.0.0.1:${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
      - type: volume
        source: frontend-node-modules
        target: /app/node_modules
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  frontend-node-modules:
