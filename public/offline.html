<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9C3A1E" />
    <title>SIPEG sin conexion</title>
    <style>
      :root {
        color: #33261f;
        background: #fbf7f2;
        font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
      }

      body {
        display: grid;
        margin: 0;
        min-height: 100vh;
        place-items: center;
      }

      main {
        background: rgba(255, 253, 249, 0.92);
        border: 1px solid rgba(51, 38, 31, 0.14);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(62, 32, 18, 0.09);
        max-width: 520px;
        padding: 32px;
      }

      strong {
        color: #9c3a1e;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        font-family: Georgia, serif;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 0.95;
        margin: 12px 0 16px;
      }

      p {
        color: #6b5a4f;
        font-size: 1rem;
        line-height: 1.7;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>SIPEG</strong>
      <h1>Sin conexion</h1>
      <p>
        La aplicacion no pudo conectarse. Si ya abriste SIPEG antes, vuelve al inicio cuando
        recuperes conexion para sincronizar los modulos.
      </p>
    </main>
  </body>
</html>
